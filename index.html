<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계관 설정집</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F8;--pn:#fff;--ink:#1B1F33;--mu:#6B7090;--ln:#DDE0EC;--ac:#3D4CC0;--tint:#E6E9FB;--dg:#B3365B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161F;--pn:#1C1F2B;--ink:#E7E9F5;--mu:#8E93AD;--ln:#2B3045;--ac:#9AA6FF;--tint:#262B47;--dg:#FF8FAE}}
:root[data-theme="dark"]{--bg:#14161F;--pn:#1C1F2B;--ink:#E7E9F5;--mu:#8E93AD;--ln:#2B3045;--ac:#9AA6FF;--tint:#262B47;--dg:#FF8FAE}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--ln)}
.brand{font:700 1.1rem 'Gowun Batang','Batang',serif;color:var(--ink);text-decoration:none}
h1{font:700 1.75rem/1.3 'Gowun Batang','Batang',serif;margin:.4em 0 .3em}
h2{font:700 1.15rem 'Gowun Batang','Batang',serif;margin:1.6em 0 .4em}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b{font:inherit;border:1px solid var(--ln);background:var(--pn);color:var(--ink);border-radius:8px;padding:6px 12px;min-height:40px;cursor:pointer}
a.b{display:inline-flex;align-items:center;text-decoration:none;box-sizing:border-box}
.b.p{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.b.d{color:var(--dg)}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:9px 11px;box-sizing:border-box}
textarea{resize:none;display:block;overflow:hidden}
label{display:block;font-size:.85rem;color:var(--mu);margin:16px 0 4px}
.ti{font:700 1.5rem 'Gowun Batang','Batang',serif;margin-top:8px}
.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.row input{flex:1;min-width:0;width:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crumb,.mu{color:var(--mu);font-size:.9rem}.crumb a{text-decoration:none}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:4px 14px 14px}
.list{list-style:none;padding:0;margin:8px 0}.list li{border-bottom:1px solid var(--ln);padding:10px 2px}.list a{text-decoration:none;font-weight:500}
dt{font-size:.85rem;font-weight:500;color:var(--mu);margin-top:20px}
dd{margin:2px 0 0}
dd a{color:var(--ac);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;background:var(--tint);border-radius:3px;padding:0 3px}
.dead{border-bottom:1px dashed var(--mu);color:var(--mu)}
#nav{position:fixed;top:0;bottom:0;left:0;width:min(84vw,300px);background:var(--pn);border-right:1px solid var(--ln);transform:translateX(-100%);transition:transform .2s;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 24px;z-index:5;box-sizing:border-box}
#nav.open{transform:none}
.nt{font:700 1.1rem 'Gowun Batang','Batang',serif;margin-bottom:8px}
.ct{display:flex;justify-content:space-between;padding:8px 8px;border-radius:6px;font-weight:500;text-decoration:none}
.ct small{color:var(--mu)}
#nav ul{list-style:none;margin:0 0 6px 10px;padding:0 0 0 8px;border-left:2px solid var(--ln)}
#nav li a{display:block;padding:5px 8px;border-radius:6px;text-decoration:none;font-size:.95rem}
#nav a.on{background:var(--tint);color:var(--ac)}
#nav li a.ct{display:flex;justify-content:space-between;font-size:1rem;font-weight:500}
main{padding:16px 16px 72px;max-width:720px;margin:0 auto}
@media (min-width:860px){.wrap{display:grid;grid-template-columns:290px 1fr}#nav{position:sticky;top:49px;height:calc(100vh - 49px);transform:none;align-self:start;z-index:1}#mb{display:none}}
summary{cursor:pointer}.mt{min-height:55vh;font:1.05rem/1.9 'Gowun Batang','Batang',serif;margin-top:12px}
@media (prefers-reduced-motion:reduce){#nav{transition:none}}
</style>
</head>
<body>
<header><button class="b" id="mb" aria-label="목차 열기">☰</button><a class="brand" href="#">세계관 설정집</a><span id="ss" class="mu" style="margin-left:auto;font-size:.75rem"></span><button class="b" id="gl" style="max-width:40vw;min-height:34px;padding:2px 10px;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Google 로그인</button></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
const KEY='webnovel-setting-v1',$=s=>document.querySelector(s);
const T={'배경':['시대','지리·기후','분위기','역사','세계의 규칙','비고'],'국가':['국호','수도','인구','정치 체제','주요 종족','문화','경제','군사력','역사','비고'],'종족':['외형','수명','특징·능력','문화','약점','거주지','비고'],'인물':['나이','소속','외모','성격','능력','목표','과거','인간관계','비고'],'아이템':['종류','등급','효과','유래','소유자','제한·부작용','비고'],'능력':['종류','발동 조건','효과','대가·제한','등급','습득 방법','비고']};
const uid=()=>Math.random().toString(36).slice(2,9);
let S,W,editing=false,pend=false,lastTa=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(S&&S.cats)S={works:[{id:uid(),name:'내 작품',cats:S.cats}]};
if(!S||!S.works)S={works:[]};
const seed=()=>Object.keys(T).map(n=>({id:uid(),name:n,fields:T[n],entries:[],subs:[]}));
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{if(W)W.u=Date.now();saveLocal();sched()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const walk=(l,f,p=[],r=null)=>l.forEach(c=>{f(c,p,r);walk(c.subs,f,p.concat(c),c)});
const norm=l=>l.forEach(c=>{c.subs=c.subs||[];c.entries=c.entries||[];c.fields=c.fields||[];norm(c.subs)});
const cats=w=>{const r=[];walk((w||W).cats,(c,p,par)=>r.push({c,p,par}));return r};
const findC=(id,w)=>cats(w).find(x=>x.c.id===id);
const cnt=c=>c.entries.length+c.subs.reduce((n,s)=>n+cnt(s),0);
const all=w=>cats(w).flatMap(({c})=>c.entries.map(e=>({e,c})));
const fl=(c,e)=>e.fields||c.fields.concat((e.ex||[]).filter(f=>!c.fields.includes(f)));
S.works.forEach(w=>norm(w.cats));
function mkCat(list,v){v=v.trim();if(!v)return;const c={id:uid(),name:v,fields:(T[v]||[]).slice(),setup:1,entries:[],subs:[]};list.push(c);save();location.hash='#c/'+c.id}
const getE=id=>all().find(x=>x.e.id===id);
const byName=(n,w)=>all(w).find(x=>x.e.name===n);
const route=()=>{const [k,id]=location.hash.slice(1).split('/');return{k,id}};
function rich(t,w){return t.split(/(\[\[[^\]]+\]\])/).map(p=>{const m=p.match(/^\[\[(.+)\]\]$/);if(!m)return esc(p).replace(/\n/g,'<br>');const n=m[1].trim(),x=byName(n,w);return x?`<a href="#e/${x.e.id}">${esc(n)}</a>`:`<span class="dead" title="아직 없는 설정">${esc(n)}</span>`}).join('')}
function arm(b,fn){const o=b.textContent;b.onclick=()=>{if(b.dataset.a)return fn();b.dataset.a=1;b.textContent='한 번 더 누르면 삭제';setTimeout(()=>{delete b.dataset.a;b.textContent=o},3000)}}
function nav(){const{k,id}=route();
if(!W){$('#nav').innerHTML='<div class="nt">작품</div>'+S.works.map(w=>`<a class="ct" href="#w/${w.id}">${esc(w.name)}</a>`).join('');return}
const tree=c=>`<div><a class="ct${k==='c'&&id===c.id?' on':''}" href="#c/${c.id}">${esc(c.name)}<small>${cnt(c)}</small></a><ul>${c.subs.map(s=>`<li>${tree(s)}</li>`).join('')}${c.entries.map(e=>`<li><a class="${k==='e'&&id===e.id?'on':''}" href="#e/${e.id}">${esc(e.name)}</a></li>`).join('')}</ul></div>`;
$('#nav').innerHTML=`<a class="mu" href="#">← 작품 목록</a><div class="nt"><a href="#w/${W.id}" style="text-decoration:none">${esc(W.name)}</a></div>`+W.cats.map(c=>tree(c)).join('')+'<div class="row"><input id="nc" placeholder="새 목차 이름"><button class="b" id="nb">추가</button></div>';
const add=()=>mkCat(W.cats,$('#nc').value);
$('#nb').onclick=add;$('#nc').onkeydown=e=>{if(e.key==='Enter')add()}}
function home(){
$('#main').innerHTML=`<h1>세계관 설정집</h1><p>작품마다 목차와 설정을 따로 관리해요. 작품을 추가해서 시작하세요.</p><div class="row"><input id="nw" placeholder="작품 제목"><button class="b p" id="wa">작품 추가</button></div><label style="display:flex;gap:8px;align-items:center;margin:0 0 8px"><input type="checkbox" id="wd" checked style="width:auto"> 기본 목차(배경·국가·종족·인물·아이템·능력)로 시작</label>`+(S.works.length?`<ul class="list">${S.works.map(w=>`<li><a href="#w/${w.id}">${esc(w.name)}</a> <span class="mu">목차 ${cats(w).length}개 · 요소 ${all(w).length}개</span></li>`).join('')}</ul>`:'<p class="mu">아직 작품이 없어요.</p>')+cfgUI()+'<p class="mu">이 기기에 자동 저장되고, 로그인하면 계정에도 동기화돼요.</p>';
const add=()=>{const v=$('#nw').value.trim();if(!v)return;const w={id:uid(),name:v,cats:$('#wd').checked?seed():[],u:Date.now()};S.works.push(w);save();location.hash='#w/'+w.id};
$('#wa').onclick=add;$('#nw').onkeydown=e=>{if(e.key==='Enter')add()};cfgBind()}
function workView(){
$('#main').innerHTML=`<div class="top"><span class="crumb"><a href="#">작품 목록</a></span><button class="b" id="ed">${editing?'편집 완료':'작품 편집'}</button></div><h1>${esc(W.name)}</h1><div class="row"><button class="b p" id="wr">집필하기</button><button class="b" id="dv">드라이브용 ZIP 저장</button></div><div id="dvs"></div>`+(editing?`<div class="card"><label for="wn">작품 제목</label><input id="wn" value="${esc(W.name)}"><div class="row"><button class="b d" id="wdl">이 작품 삭제 (안의 설정도 함께)</button></div></div>`:'')+`<h2>설정 검색</h2>${searchUI()}<h2>이 작품의 목차</h2><div class="row"><input id="wc" placeholder="새 목차 이름"><button class="b p" id="wb">목차 추가</button></div>`+(W.cats.length?`<ul class="list">${W.cats.map(c=>`<li><a href="#c/${c.id}">${esc(c.name)}</a> <span class="mu">${c.subs.length?`하위 목차 ${c.subs.length}개 · `:''}요소 ${c.entries.length}개</span></li>`).join('')}</ul>`:'<p class="mu">목차가 없어요. 위 칸에 이름을 입력해 추가하세요.</p>');
$('#ed').onclick=()=>{editing=!editing;render()};
$('#wr').onclick=()=>{location.hash='#r/'+W.id};$('#dv').onclick=driveSave;bindSearch();
const add=()=>mkCat(W.cats,$('#wc').value);
$('#wb').onclick=add;$('#wc').onkeydown=e=>{if(e.key==='Enter')add()};
if(editing){$('#wn').onchange=ev=>{W.name=ev.target.value.trim()||W.name;save();nav()};arm($('#wdl'),()=>{S.works.splice(S.works.indexOf(W),1);(S.del=S.del||[]).push(W.id);save();location.hash=''})}}
function fieldsUI(a){const sg=['설명','특징','역사','관계','비고'].filter(x=>!a.includes(x));return `<label>설정 항목</label><div id="fl">${a.map((f,i)=>`<div class="row"><input data-i="${i}" value="${esc(f)}" aria-label="항목 이름"><button class="b d" data-x="${i}">삭제</button></div>`).join('')}</div><div class="row"><input id="fnew" placeholder="새 항목 (예: 국호)"><button class="b" id="fadd">항목 추가</button></div>`+(sg.length?`<label>자주 쓰는 항목</label><div class="row">${sg.map(x=>`<button class="b" data-s="${x}">+ ${x}</button>`).join('')}</div>`:'')}
function fieldsBind(A){
const add=(v,f)=>{v=v.trim();if(!v||A.r().includes(v))return;A.w().push(v);save();fo=1;render();if(f){const n=$('#fnew');if(n)n.focus()}};
document.querySelectorAll('#fl input').forEach(t=>t.onchange=()=>{const i=+t.dataset.i,o=A.r()[i],n=t.value.trim();if(!n||A.r().includes(n)){t.value=o;return}A.ren(o,n);A.w()[i]=n;save();fo=1;render()});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{A.w().splice(+b.dataset.x,1);save();fo=1;render()});
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>add(b.dataset.s));
$('#fadd').onclick=()=>add($('#fnew').value,1);$('#fnew').onkeydown=e=>{if(e.key==='Enter')add($('#fnew').value,1)}}
function catView(c){
const{p,par}=findC(c.id),crumb=['<a href="#">작품 목록</a>',`<a href="#w/${W.id}">${esc(W.name)}</a>`].concat(p.map(a=>`<a href="#c/${a.id}">${esc(a.name)}</a>`)).join(' / ');
const back=par?'#c/'+par.id:'#w/'+W.id,FA={r:()=>c.fields,w:()=>c.fields,ren:(o,n)=>c.entries.forEach(e=>{if(!e.fields&&o in e.v){e.v[n]=e.v[o];delete e.v[o]}})};
if(c.setup){
$('#main').innerHTML=`<div class="row" style="margin:0 0 6px"><a class="b" href="${back}">← 뒤로</a></div><div class="top"><span class="crumb">${crumb}</span></div><h1>${esc(c.name)}</h1><p>이 목차 안의 요소에 쓸 항목을 미리 정해 둘 수 있어요(선택). 예를 들어 국가라면 국호·인구·체제 같은 것이에요. 건너뛰어도 나중에 언제든 추가할 수 있어요.</p>`+fieldsUI(c.fields)+`<div class="row"><button class="b p" id="sd">항목 정하기 완료</button><button class="b" id="sk">나중에 정할게요</button></div>`;
fieldsBind(FA);
$('#sd').onclick=$('#sk').onclick=()=>{if(!c.fields.length)c.fields=['설명'];delete c.setup;fo=0;save();render()};
return}
const subs=c.subs.length?`<ul class="list">${c.subs.map(s=>`<li><a href="#c/${s.id}">${esc(s.name)}</a> <span class="mu">${cnt(s)}개</span></li>`).join('')}</ul>`:'<p class="mu">아직 하위 목차가 없어요.</p>';
const list=c.entries.length?`<ul class="list">${c.entries.map(e=>`<li><a href="#e/${e.id}">${esc(e.name)}</a></li>`).join('')}</ul>`:'<p class="mu">아직 요소가 없어요.</p>';
$('#main').innerHTML=`<div class="row" style="margin:0 0 6px"><a class="b" href="${back}">← 뒤로</a></div><div class="top"><span class="crumb">${crumb}</span><button class="b" id="ed">${editing?'편집 완료':'목차 편집'}</button></div><h1>${esc(c.name)}</h1>`+(editing?`<div class="card"><label for="cn">목차 이름</label><input id="cn" value="${esc(c.name)}"><div class="row"><button class="b d" id="cd">이 목차 삭제 (하위 목차·요소도 함께)</button></div></div>`:'')+`<details${fo?' open':''} class="card" style="margin:12px 0;padding:6px 14px 10px"><summary>항목 설정 (${c.fields.length}개)</summary>${fieldsUI(c.fields)}<p class="mu">항목 이름을 바꿔도 이미 쓴 내용은 그대로 옮겨져요.</p></details><h2>하위 목차</h2><div class="row"><input id="ns" placeholder="새 하위 목차 이름"><button class="b p" id="nsb">목차 추가</button></div>${subs}<h2>요소</h2><div class="row"><input id="ne" placeholder="새 요소 이름"><button class="b p" id="na">요소 추가</button></div>${list}`;
$('#ed').onclick=()=>{editing=!editing;render()};
const add=()=>{const v=$('#ne').value.trim();if(!v)return;const e={id:uid(),name:v,v:{}};c.entries.push(e);save();pend=true;location.hash='#e/'+e.id};
$('#na').onclick=add;$('#ne').onkeydown=e=>{if(e.key==='Enter')add()};
const adds=()=>mkCat(c.subs,$('#ns').value);$('#nsb').onclick=adds;$('#ns').onkeydown=e=>{if(e.key==='Enter')adds()};
fieldsBind(FA);if(editing){
$('#cn').onchange=ev=>{c.name=ev.target.value.trim()||c.name;save();nav()};
arm($('#cd'),()=>{(par?par.subs:W.cats).splice((par?par.subs:W.cats).indexOf(c),1);save();location.hash=par?'#c/'+par.id:'#w/'+W.id})}}
function entryView({e,c}){
const back='#c/'+c.id,own=()=>{if(!e.fields){e.fields=fl(c,e).slice();delete e.ex}return e.fields};
const crumb=[`<a href="#w/${W.id}">${esc(W.name)}</a>`].concat(findC(c.id).p.concat(c).map(a=>`<a href="#c/${a.id}">${esc(a.name)}</a>`)).join(' / ');
let h=`<div class="row" style="margin:0 0 6px"><a class="b" href="${back}">← 뒤로</a></div><div class="top"><span class="crumb">${crumb}</span><button class="b p" id="ed">${editing?'완료':'편집'}</button></div>`;
if(editing){
h+=`<input class="ti" id="en" value="${esc(e.name)}" aria-label="이름">`+fl(c,e).map((n,i)=>`<label for="f${i}">${esc(n)}</label><textarea id="f${i}" data-f="${esc(n)}">${esc(e.v[n]||'')}</textarea>`).join('')
+`<details${fo?' open':''} class="card" style="margin:16px 0;padding:6px 14px 10px"><summary>항목 설정 (${fl(c,e).length}개)</summary>${fieldsUI(fl(c,e))}${e.fields?'<div class="row"><button class="b" id="frs">목차의 항목으로 되돌리기</button></div>':''}<p class="mu">여기서 바꾸면 이 요소에만 적용돼요.</p></details><label for="lk">입력 중인 칸에 다른 설정 링크 넣기</label><select id="lk"><option value="">설정 고르기…</option>${cats().map(x=>x.c.entries.some(y=>y!==e)?`<optgroup label="${esc(x.p.concat(x.c).map(a=>a.name).join(' › '))}">${x.c.entries.filter(y=>y!==e).map(y=>`<option>${esc(y.name)}</option>`).join('')}</optgroup>`:'').join('')}</select><div class="row"><button class="b d" id="del">이 설정 삭제</button></div>`;
}else{
h+=`<h1>${esc(e.name)}</h1><dl>`+fl(c,e).map(n=>`<dt>${esc(n)}</dt><dd>${e.v[n]?rich(e.v[n]):'<span class="mu">비어 있음</span>'}</dd>`).join('')+'</dl>';
const bl=all().filter(y=>y.e!==e&&Object.values(y.e.v).some(t=>String(t).includes('[['+e.name+']]')));
if(bl.length)h+=`<h2>이 설정을 언급한 곳</h2><ul class="list">${bl.map(y=>`<li><a href="#e/${y.e.id}">${esc(y.e.name)}</a> <span class="mu">${esc(y.c.name)}</span></li>`).join('')}</ul>`}
$('#main').innerHTML=h;
$('#ed').onclick=()=>{editing=!editing;render()};
if(!editing)return;
$('#en').onchange=ev=>{const o=e.name,n=ev.target.value.trim()||o;ev.target.value=n;if(n===o)return;all().forEach(({e:y})=>{for(const q in y.v)y.v[q]=y.v[q].split('[['+o+']]').join('[['+n+']]')});e.name=n;save();nav()};
document.querySelectorAll('textarea').forEach(t=>{const fit=()=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};fit();t.oninput=()=>{e.v[t.dataset.f]=t.value;save();fit()};t.onfocus=()=>lastTa=t});
$('#lk').onchange=ev=>{const v=ev.target.value;ev.target.value='';const t=lastTa||document.querySelector('textarea');if(!v||!t)return;const s=t.selectionStart||t.value.length;t.setRangeText('[['+v+']]',s,Math.max(s,t.selectionEnd||s),'end');t.dispatchEvent(new Event('input'));t.focus()};
fieldsBind({r:()=>fl(c,e),w:own,ren:(o,n)=>{if(o in e.v){e.v[n]=e.v[o];delete e.v[o]}}});
const rs=$('#frs');if(rs)rs.onclick=()=>{delete e.fields;fo=1;save();render()};
arm($('#del'),()=>{c.entries.splice(c.entries.indexOf(e),1);save();location.hash='#c/'+c.id})}
let scope='in',fo=0;
function searchUI(){return `<div class="row"><input id="q" placeholder="설정 검색 (이름·내용)"></div><div class="row"><button class="b" data-sc="in">이 작품 안</button><button class="b" data-sc="out">모든 작품</button></div><div id="sr"></div>`}
function bindSearch(){const q=$('#q'),r=$('#sr');
const run=()=>{document.querySelectorAll('[data-sc]').forEach(b=>b.classList.toggle('p',b.dataset.sc===scope));
const v=q.value.trim().toLowerCase();if(!v){r.innerHTML='';return}
const hits=(scope==='in'?[W]:S.works).flatMap(w=>all(w).map(({c,e})=>({w,c,e}))).filter(({c,e})=>(e.name+' '+Object.values(e.v).join(' ')).toLowerCase().includes(v));
r.innerHTML=hits.length?hits.slice(0,30).map(({w,c,e})=>`<details class="card" style="margin:6px 0;padding:8px 14px"><summary><b>${esc(e.name)}</b> <span class="mu">${scope==='out'?esc(w.name)+' › ':''}${esc(c.name)}</span></summary><dl>${fl(c,e).filter(f=>e.v[f]).map(f=>`<dt>${esc(f)}</dt><dd>${rich(e.v[f],w)}</dd>`).join('')}</dl><a href="#e/${e.id}">설정 페이지 열기</a></details>`).join(''):'<p class="mu">찾은 설정이 없어요.</p>'};
q.oninput=run;document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{scope=b.dataset.sc;run()});run()}
function writeView(){
if(!W.ch)W.ch=[];if(!W.ch.length)W.ch.push({id:uid(),t:'1화',x:''});const ko=y=>({'프롤로그':0,'외전':2}[y.k]??1);W.ch.sort((a,b)=>ko(a)-ko(b));
const c=W.ch.find(y=>y.id===W.cur)||W.ch[0];W.cur=c.id;
$('#main').innerHTML=`<div class="top"><span class="crumb"><a href="#">작품 목록</a> / <a href="#w/${W.id}">${esc(W.name)}</a></span></div><h1>집필</h1><div class="row"><select id="cs" style="flex:1;width:auto" aria-label="회차">${W.ch.map(y=>`<option value="${y.id}"${y===c?' selected':''}>${esc(y.t)}</option>`).join('')}</select><button class="b" id="cp">프롤로그</button><button class="b" id="cn2">새 회차</button><button class="b" id="ce">외전</button></div><input class="ti" id="ct" value="${esc(c.t)}" aria-label="회차 제목"><textarea id="tx" class="mt" placeholder="여기에 원고를 쓰세요">${esc(c.x)}</textarea><div class="mu" id="cnt"></div><div class="row"><button class="b p" id="dv">드라이브용 ZIP 저장</button></div><div id="dvs"></div><h2>설정 찾아보기</h2>`+searchUI();
const t=$('#tx'),fit=()=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'},cnt=()=>{$('#cnt').textContent=`공백 포함 ${t.value.length}자 · 공백 제외 ${t.value.replace(/\s/g,'').length}자`};
fit();cnt();t.oninput=()=>{c.x=t.value;save();fit();cnt()};
$('#cs').onchange=ev=>{W.cur=ev.target.value;save();writeView()};
const addc=k=>{const n=W.ch.filter(y=>(y.k||'본편')===k).length+1,z={id:uid(),k,t:k==='프롤로그'?(n>1?'프롤로그 '+n:'프롤로그'):k==='외전'?'외전 '+n:n+'화',x:''};W.ch.push(z);W.cur=z.id;save();writeView()};$('#cp').onclick=()=>addc('프롤로그');$('#cn2').onclick=()=>addc('본편');$('#ce').onclick=()=>addc('외전');
$('#ct').onchange=ev=>{c.t=ev.target.value.trim()||c.t;save();writeView()};
bindSearch();$('#dv').onclick=driveSave;
}
function zip(files){const te=new TextEncoder(),T=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}
const crc=d=>{let c=-1;for(const b of d)c=T[(c^b)&255]^(c>>>8);return(c^-1)>>>0},u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>24&255];
const parts=[],cen=[];let off=0;
for(const f of files){const nb=te.encode(f.n),c=crc(f.d),L=f.d.length,h=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(L),...u32(L),...u16(nb.length),...u16(0)]);
parts.push(h,nb,f.d);cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(L),...u32(L),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);off+=h.length+nb.length+L}
const cs=cen.reduce((a,b)=>a+b.length,0);
parts.push(...cen,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]));
return new Blob(parts,{type:'application/zip'})}
function driveSave(){const out=$('#dvs');
const nm=x=>String(x).replace(/[\/\\:*?"<>|]/g,'-').trim()||'이름 없음',te=new TextEncoder(),used=new Set(),files=[];
const base='세계관 만들기/'+nm(W.name)+'/';
const add=(dir,t,x)=>{const n=dir+nm(t);let k=n,i=2;while(used.has(k))k=n+' ('+(i++)+')';used.add(k);files.push({n:k+'.txt',d:te.encode(x)})};
cats().forEach(y=>y.c.entries.forEach(e=>add(base+'설정/'+y.p.map(a=>nm(a.name)+'/').join('')+nm(y.c.name)+'/',e.name,e.name+'\n\n'+fl(y.c,e).map(f=>f+': '+(e.v[f]||'')).join('\n\n'))));
(W.ch||[]).forEach(h=>add(base+'원고/',h.t,h.t+'\n\n'+h.x));
if(!files.length){out.innerHTML='<p class="mu">저장할 설정이나 원고가 아직 없어요.</p>';return}
const blob=zip(files),fn='세계관 만들기_'+nm(W.name)+'.zip',file=new File([blob],fn,{type:'application/zip'});
const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove()};
dl();const can=navigator.canShare&&navigator.canShare({files:[file]});
out.innerHTML=`<p class="mu">문서 ${files.length}개가 든 ZIP을 만들었어요. 압축을 풀어 드라이브에 올리면 폴더 구조가 그대로 유지돼요.</p><div class="row"><button class="b" id="zd">ZIP 다시 받기</button>${can?'<button class="b p" id="zs">공유로 드라이브 앱에 보내기</button>':''}</div>`;
$('#zd').onclick=dl;const zs=$('#zs');if(zs)zs.onclick=()=>navigator.share({files:[file],title:fn}).catch(()=>{})}
const FBK='sj-fb-v1',FB_PRESET=null;let FB=FB_PRESET;try{FB=JSON.parse(localStorage.getItem(FBK))||FB_PRESET}catch(e){}
const G={user:null},setSS=m=>{const e=$('#ss');if(e)e.textContent=m},gBtn=()=>{const b=$('#gl');if(b)b.textContent=G.user?G.user.name+' · 로그아웃':'Google 로그인'};
const openCfg=()=>{if(location.hash.length>1)location.hash='';else render();setTimeout(()=>{const d=$('#cfgd');if(d){d.open=true;d.scrollIntoView()}},60)};
const hs=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return h};
let fdb=null,fuid=null,fbP=null,syncing=false,tmr=null,lastH={};
const cfgUI=()=>`<details id="cfgd" class="card" style="margin:16px 0;padding:6px 14px 10px"><summary>계정·동기화 설정 (Firebase)</summary><label for="fbc">Firebase 웹앱 설정값 붙여넣기</label><textarea id="fbc" placeholder="const firebaseConfig = { apiKey: &quot;...&quot;, authDomain: &quot;...&quot;, projectId: &quot;...&quot;, appId: &quot;...&quot; };" style="min-height:120px;overflow:auto">${FB?esc(JSON.stringify(FB)):''}</textarea><div class="row"><button class="b p" id="fbs">저장</button></div><p class="mu" id="fbm">${FB?'설정값이 저장돼 있어요.':'설정값이 없으면 로그인과 동기화를 쓸 수 없어요.'}</p></details>`;
const cfgBind=()=>{$('#fbs').onclick=()=>{const t=$('#fbc').value,c={};
for(const k of ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId']){const m=t.match(new RegExp('["\']?'+k+'["\']?\\s*[:=]\\s*["\']([^"\']+)["\']'));if(m)c[k]=m[1]}
if(!c.apiKey||!c.projectId){$('#fbm').textContent='apiKey와 projectId를 찾지 못했어요. 설정값을 통째로 붙여 넣어 주세요.';return}
if(!c.authDomain)c.authDomain=c.projectId+'.firebaseapp.com';
FB=c;try{localStorage.setItem(FBK,JSON.stringify(c))}catch(e){}
$('#fbm').textContent='저장했어요. 위쪽의 Google 로그인 버튼을 눌러 보세요.';fbInit().catch(()=>setSS('연결 실패'))}};
function loadFB(){return fbP||(fbP=new Promise((ok,no)=>{const L=['app','auth','firestore'];let i=0;const nx=()=>{if(i===L.length)return ok();const e=document.createElement('script');e.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-'+L[i++]+'-compat.js';e.onload=nx;e.onerror=()=>{fbP=null;no(new Error('Firebase를 불러오지 못했어요'))};document.head.appendChild(e)};nx()}))}
async function fbInit(){if(!FB||fdb)return;await loadFB();if(!firebase.apps.length)firebase.initializeApp(FB);fdb=firebase.firestore();
firebase.auth().onAuthStateChanged(u=>{fuid=u?u.uid:null;G.user=u?{name:u.displayName||u.email||'로그인됨'}:null;gBtn();setSS('');
if(u){if(S.uid&&S.uid!==u.uid){S.works=[];S.del=[];lastH={};render()}S.uid=u.uid;saveLocal();sync()}})}
const wdoc=w=>fdb.collection('users').doc(fuid).collection('works').doc(w.id);
async function pushWork(w,dry){const r=wdoc(w),d={name:w.name,cats:JSON.stringify(w.cats),cur:w.cur||'',u:w.u||0,ids:(w.ch||[]).map(c=>c.id)},h=hs(JSON.stringify(d)),k='w'+w.id;
if(lastH[k]!==h){if(!dry)await r.set(d);lastH[k]=h}
for(const c of w.ch||[]){const kk=w.id+'/'+c.id,hh=hs(c.t+'|'+(c.k||'')+'|'+c.x);if(lastH[kk]!==hh){if(!dry)await r.collection('ch').doc(c.id).set({t:c.t,k:c.k||'',x:c.x});lastH[kk]=hh}}}
async function pushTomb(){if(!(S.del||[]).length)return;await fdb.collection('users').doc(fuid).collection('meta').doc('tomb').set({ids:firebase.firestore.FieldValue.arrayUnion(...S.del)},{merge:true})}
async function pull(){let changed=false;const base=fdb.collection('users').doc(fuid);
const td=(await base.collection('meta').doc('tomb').get()).data(),tomb=((td&&td.ids)||[]).concat(S.del||[]);
const n0=S.works.length;S.works=S.works.filter(w=>!tomb.includes(w.id));if(S.works.length!==n0)changed=true;
const snap=await base.collection('works').get();
for(const doc of snap.docs){const c=doc.data(),id=doc.id;if(tomb.includes(id))continue;const l=S.works.find(w=>w.id===id);
if(l&&(l.u||0)>=(c.u||0)){if((l.u||0)===(c.u||0))await pushWork(l,true);continue}
const ch=(await Promise.all((c.ids||[]).map(i=>doc.ref.collection('ch').doc(i).get()))).filter(x=>x.exists).map(x=>Object.assign({id:x.id},x.data()));
const nw={id,name:c.name,cats:JSON.parse(c.cats),cur:c.cur||undefined,u:c.u,ch};
if(l)Object.assign(l,nw);else S.works.push(nw);changed=true;await pushWork(nw,true)}
for(const w of S.works){const d=snap.docs.find(x=>x.id===w.id);if(!d||(w.u||0)>(d.data().u||0))await pushWork(w)}
await pushTomb();return changed}
async function sync(){if(!fuid||syncing)return;syncing=true;clearTimeout(tmr);setSS('동기화 중…');
try{const ch=await pull();saveLocal();setSS('동기화됨');syncing=false;if(ch)render()}catch(e){syncing=false;setSS('동기화 실패')}}
function sched(){clearTimeout(tmr);if(!fuid)return;setSS('저장 대기…');tmr=setTimeout(flush,1500)}
async function flush(){if(!fuid)return;if(syncing){tmr=setTimeout(flush,1500);return}
syncing=true;setSS('동기화 중…');try{await pushTomb();for(const w of S.works)await pushWork(w);setSS('동기화됨')}catch(e){setSS('동기화 실패')}syncing=false}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&fuid)sync()});
if(FB)fbInit().catch(()=>setSS('연결 실패'));
function render(){lastTa=null;const{k,id}=route();W=null;
if(k==='w'||k==='r')W=S.works.find(w=>w.id===id);
else if(k==='c')W=S.works.find(w=>findC(id,w));
else if(k==='e')W=S.works.find(w=>all(w).some(x=>x.e.id===id));
nav();
if(!W)return home();
if(k==='r')return writeView();
if(k==='e')return entryView(getE(id));
if(k==='c')return catView(findC(id).c);
workView()}
addEventListener('hashchange',()=>{editing=pend;pend=false;fo=0;render();$('#nav').classList.remove('open');scrollTo(0,0)});
$('#mb').onclick=()=>$('#nav').classList.toggle('open');
$('#main').onclick=()=>$('#nav').classList.remove('open');
$('#gl').onclick=async()=>{if(G.user){await firebase.auth().signOut();return}
if(!FB){openCfg();return}
try{await fbInit();await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){setSS('로그인 실패')}};
render();
